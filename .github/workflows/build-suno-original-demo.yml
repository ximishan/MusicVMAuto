name: Build Suno Original Demo

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'suno_original_demo/**'
      - '.github/workflows/build-suno-original-demo.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: suno_original_demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Syntax check
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js

      - name: Build portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-Item 'dist\Suno_Original_Demo_v0.1.0.exe'
          if ($exe.Length -lt 50000000) { throw "EXE unexpectedly small: $($exe.Length)" }
          Write-Host "Built:" $exe.FullName $exe.Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suno_Original_Demo_v0.1.0_Windows
          path: suno_original_demo/dist/Suno_Original_Demo_v0.1.0.exe
          if-no-files-found: error

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: suno-original-demo-v0.1.0
          name: Suno Original Demo v0.1.0
          prerelease: true
          make_latest: false
          files: suno_original_demo/dist/Suno_Original_Demo_v0.1.0.exe
          body: |
            First standalone Windows demo for Suno original-song creation.
            Features: 3 persistent Suno account slots, custom title/lyrics/style, direct original submission, task status refresh.
            Human verification is never bypassed; when Suno requests verification the account window is shown for manual completion.
