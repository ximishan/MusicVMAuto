name: Build Suno Original Demo

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'suno_original_demo/**'
      - '.github/workflows/build-suno-original-demo.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: suno_original_demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report build started
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force build_status | Out-Null
          @"
          status=started
          run_id=${{ github.run_id }}
          artifact=Suno_Original_Demo_v0.1.1_Windows
          exe=Suno_Original_Demo_v0.1.1.exe
          source_sha=${{ github.sha }}
          "@ | Set-Content -Encoding UTF8 build_status/suno_original_demo.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_status/suno_original_demo.txt
          git commit -m "Start Suno original demo build ${{ github.run_id }}" || exit 0
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Syntax check
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js

      - name: Build portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-Item 'dist\Suno_Original_Demo_v0.1.1.exe'
          if ($exe.Length -lt 50000000) { throw "EXE unexpectedly small: $($exe.Length)" }
          Write-Host "Built:" $exe.FullName $exe.Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suno_Original_Demo_v0.1.1_Windows
          path: suno_original_demo/dist/Suno_Original_Demo_v0.1.1.exe
          if-no-files-found: error

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: suno-original-demo-v0.1.1
          name: Suno Original Demo v0.1.1
          prerelease: true
          make_latest: false
          files: suno_original_demo/dist/Suno_Original_Demo_v0.1.1.exe
          body: |
            Verification-flow test build.
            When Suno requests human verification, the matching account window is brought to front and kept visible.
            After the user completes Suno's official verification, the app detects clearance and automatically resumes the pending original-song submission.
            The app does not solve, click through, or bypass CAPTCHA challenges.

      - name: Report successful build
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          git pull --rebase
          @"
          status=success
          run_id=${{ github.run_id }}
          artifact=Suno_Original_Demo_v0.1.1_Windows
          exe=Suno_Original_Demo_v0.1.1.exe
          source_sha=${{ github.sha }}
          "@ | Set-Content -Encoding UTF8 build_status/suno_original_demo.txt
          git add build_status/suno_original_demo.txt
          git commit -m "Finish Suno original demo build ${{ github.run_id }}" || exit 0
          git push
