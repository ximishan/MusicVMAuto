name: Build AVR Cover Automation EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'avr_build/**'
      - '.github/workflows/build-avr-cover-exe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore source
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import base64, zlib
          names = ['part1a.txt', 'part1b.txt', 'part2.txt', 'part3.txt', 'part4.txt']
          data = ''.join((Path('avr_build') / name).read_text(encoding='utf-8').strip() for name in names)
          source = zlib.decompress(base64.b64decode(data))
          Path('avr_cover_single_demo.py').write_bytes(source)
          print('source bytes:', len(source))
          '@ | Set-Content -Encoding UTF8 restore_source.py
          python restore_source.py
          python avr_build/lyrics_preview_patch.py
          python avr_build/auto_wait_lyrics_preview_patch.py
          python -m py_compile avr_cover_single_demo.py

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl websocket-client pyinstaller

      - name: Build EXE
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AVR_Cover_Lyrics_Wait_Preview_v0.2.7 avr_cover_single_demo.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVR_Cover_Lyrics_Wait_Preview_v0.2.7_Windows
          path: dist/AVR_Cover_Lyrics_Wait_Preview_v0.2.7.exe
          if-no-files-found: error
