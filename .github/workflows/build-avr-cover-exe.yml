name: Build AVR Cover Automation EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'avr_build/**'
      - '.github/workflows/build-avr-cover-exe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore source
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import base64, zlib
          names = ['part1a.txt', 'part1b.txt', 'part2.txt', 'part3.txt', 'part4.txt']
          data = ''.join((Path('avr_build') / name).read_text(encoding='utf-8').strip() for name in names)
          source = zlib.decompress(base64.b64decode(data))
          Path('avr_cover_single_demo.py').write_bytes(source)
          print('source bytes:', len(source))
          '@ | Set-Content -Encoding UTF8 restore_source.py
          python restore_source.py
          python avr_build/lyrics_preview_patch.py
          python avr_build/auto_wait_lyrics_preview_patch.py
          python avr_build/strict_audio_ready_patch.py
          python avr_build/hard_wait_20s_patch.py
          python avr_build/full_flow_v030_patch.py
          python -m py_compile avr_cover_single_demo.py

      - name: Verify complete-flow markers
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          s = Path('avr_cover_single_demo.py').read_text(encoding='utf-8')
          required = [
              '完整版 v0.3.0',
              '固定等待 15 秒',
              '固定等待 20 秒',
              'confirm_material_and_wait_submit',
              '固定等待 5 秒后处理下一首',
          ]
          for x in required:
              if x not in s:
                  raise SystemExit('missing marker: ' + x)
          if 'return "PREVIEW_LYRICS_READY"' in s:
              raise SystemExit('preview return still exists')
          print('complete-flow markers verified')
          '@ | Set-Content -Encoding UTF8 verify_flow.py
          python verify_flow.py

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl websocket-client pyinstaller

      - name: Build EXE
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AVR_Cover_Automation_v0.3.0 avr_cover_single_demo.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVR_Cover_Automation_v0.3.0_Windows
          path: dist/AVR_Cover_Automation_v0.3.0.exe
          if-no-files-found: error
