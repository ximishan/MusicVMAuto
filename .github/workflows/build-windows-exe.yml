name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'host_controller.py'
      - 'host_controller_v054.py'
      - 'requirements-host.txt'
      - 'build_host.bat'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-host.txt
          python -m pip install pyinstaller

      - name: Syntax check
        shell: cmd
        run: |
          python -m py_compile host_controller.py
          python -m py_compile host_controller_v054.py

      - name: Build EXE
        shell: cmd
        run: pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --collect-all rapidocr --name MusicVMAutoNoTemplate host_controller_v054.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicVMAutoNoTemplate-Windows
          path: dist/MusicVMAutoNoTemplate.exe
          if-no-files-found: error

      - name: Publish direct EXE to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.${{ github.run_number }}
          name: MusicVMAuto v0.5 build ${{ github.run_number }}
          make_latest: true
          files: dist/MusicVMAutoNoTemplate.exe
          fail_on_unmatched_files: true
