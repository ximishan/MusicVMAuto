name: Build AI Trace Cleaner EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'audio_deai/**'
      - '.github/workflows/build-ai-trace-cleaner.yml'

permissions:
  contents: write

concurrency:
  group: ai-trace-cleaner-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller imageio-ffmpeg

      - name: Syntax check
        shell: cmd
        run: |
          python -m py_compile audio_deai\ai_trace_cleaner_v010.py

      - name: Build EXE
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --collect-all imageio_ffmpeg --name AI_Audio_Trace_Cleaner_v0.1.0 audio_deai\ai_trace_cleaner_v010.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-Item 'dist\AI_Audio_Trace_Cleaner_v0.1.0.exe'
          if ($exe.Length -lt 10000000) { throw "EXE unexpectedly small: $($exe.Length)" }
          Write-Host "Built:" $exe.FullName $exe.Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Audio_Trace_Cleaner_v0.1.0_Windows
          path: dist/AI_Audio_Trace_Cleaner_v0.1.0.exe
          if-no-files-found: error

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-audio-trace-cleaner-v0.1.0
          name: AI Audio Trace Cleaner v0.1.0
          prerelease: true
          make_latest: false
          files: dist/AI_Audio_Trace_Cleaner_v0.1.0.exe
          body: |
            First Windows test build of the standalone audio DSP tool.
            Bundles FFmpeg through imageio-ffmpeg; no external FFmpeg installation is required.

      - name: Record build run id
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_status | Out-Null
          @"
          run_id=$env:GITHUB_RUN_ID
          artifact=AI_Audio_Trace_Cleaner_v0.1.0_Windows
          exe=AI_Audio_Trace_Cleaner_v0.1.0.exe
          source_sha=$env:GITHUB_SHA
          "@ | Set-Content -Encoding UTF8 build_status\ai_trace_cleaner.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_status/ai_trace_cleaner.txt
          git commit -m "Record AI trace cleaner build $env:GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
